name: Daily Research Check-in

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "37 20 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-check-in
  cancel-in-progress: false

jobs:
  daily-check-in:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update daily activity log
        run: bash scripts/update-daily-log.sh

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- activity/daily-log.csv; then
            echo "No new daily check-in to commit."
            exit 0
          fi

          today="$(date +%F)"

          git config user.name "SIMON-WORLD"
          git config user.email "252317962+SIMON-WORLD@users.noreply.github.com"

          git add activity/daily-log.csv
          git commit -m "chore: daily research check-in ${today}"
          git push
